name: Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "web/**"
      - "functions/**"
      - "sst.config.ts"
      - "package.json"
      - ".github/workflows/deploy.yml"
    tags:
      - "prod-*"

permissions:
  id-token: write
  contents: read

# Branch pushes deploy `dev`; pushing a tag like prod-2026-09-07 deploys `prod`.
concurrency:
  group: deploy-${{ startsWith(github.ref, 'refs/tags/prod-') && 'prod' || 'dev' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      STAGE: ${{ startsWith(github.ref, 'refs/tags/prod-') && 'prod' || 'dev' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Assume deploy role via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::949228118688:role/remerge-github-deploy
          aws-region: us-east-1

      - name: Bootstrap stage (secrets, SES identity)
        run: ./infra/bootstrap.sh "$STAGE"

      - name: Load stage secrets from SSM
        run: |
          load() {
            v=$(aws ssm get-parameter --name "/remerged/$STAGE/$1" --with-decryption \
                --query Parameter.Value --output text 2>/dev/null || true)
            if [ -n "$v" ] && [ "$v" != "None" ]; then
              echo "::add-mask::$v"
              echo "$1=$v" >> "$GITHUB_ENV"
            fi
          }
          for name in SESSION_SECRET CRON_SECRET ADMIN_EMAILS EMAIL_FROM SUPPORT_FORWARD_TO \
                      STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET \
                      BYTEPLUS_API_KEY TOPAZ_API_KEY FAL_KEY PROVIDER_MODE MOCK_BILLING \
                      PIPELINE_CONCURRENCY \
                      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY CLERK_SECRET_KEY \
                      COST_SD25_480P_PER_SEC COST_SD25_1080P_PER_SEC \
                      COST_SD20_480P_PER_SEC COST_SD20_1080P_PER_SEC \
                      COST_SD20_FAST_480P_PER_SEC COST_SD20_FAST_1080P_PER_SEC \
                      COST_UPSCALE_2X_PER_SEC COST_UPSCALE_4X_PER_SEC; do
            load "$name"
          done

      # DNS for remerged.ai is at Cloudflare, so the deploy needs write access
      # to that zone. A repository secret, not an SSM parameter: only the
      # deploy uses it and it must never reach the Lambda environment. Verify
      # it first with .github/workflows/cloudflare-check.yml if a deploy
      # starts failing on DNS.
      - name: Check the Cloudflare token is present
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "CLOUDFLARE_API_TOKEN is not set. Add it under"
            echo "Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "Cloudflare token present."
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Install dependencies
        run: |
          npm install
          npm install --prefix web

      - name: Deploy ${{ env.STAGE }} stage
        env:
          # How the Cloudflare provider authenticates when SST writes the
          # domain's DNS and certificate-validation records.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx sst deploy --stage "$STAGE"
