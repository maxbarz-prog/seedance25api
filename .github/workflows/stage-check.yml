name: Stage smoke check

# Reads the public endpoints of a deployed stage: the quote API for every
# sold model and the pricing page. No auth, no writes, no generation, so it
# costs nothing and can be run freely to confirm what a deploy actually
# serves. The heavier browser run is dev-e2e.yml.

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/stage-check.yml"
  workflow_dispatch:
    inputs:
      stage:
        description: "Stage to read (dev -> https://dev.remerged.click)"
        type: string
        default: dev

permissions:
  contents: read

jobs:
  check:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Quote every sold model
        env:
          STAGE: ${{ inputs.stage }}
        run: |
          set -uo pipefail
          base="https://$STAGE.remerged.click"
          [ "$STAGE" = "prod" ] && base="https://remerged.click"
          echo "base=$base"
          fail=0

          # Ask the site what it sells rather than keeping a second copy of
          # the list here — that copy goes stale the moment a model is added
          # or withdrawn, and then this check fails for the wrong reason.
          catalogue=$(curl -sS --max-time 20 "$base/api/models")
          models=$(printf '%s' "$catalogue" | jq -r '.models[].id')
          if [ -z "$models" ]; then
            echo "FAIL: /api/models returned nothing: $catalogue"
            exit 1
          fi
          echo "offering: $(echo $models | tr '\n' ' ')"

          printf '%-24s %-16s %6s %10s\n' MODEL MODE DUR PRICE
          for model in $models; do
            maxd=$(printf '%s' "$catalogue" | jq -r --arg m "$model" '.models[]|select(.id==$m)|.maxDurationS')
            native=$(printf '%s' "$catalogue" | jq -r --arg m "$model" '.models[]|select(.id==$m)|.native1080p')
            audio=$(printf '%s' "$catalogue" | jq -r --arg m "$model" '.models[]|select(.id==$m)|.audioPriced')
            for mode in upscaled-4k upscaled-1080p native-1080p; do
              for d in 5 10; do
                [ "$d" -le "$maxd" ] || continue
                body=$(curl -sS --max-time 20 "$base/api/quote?model=$model&duration=$d&mode=$mode")
                usd=$(printf '%s' "$body" | jq -r 'if .usd then (.usd|tostring) else "n/a " + (.error // "?") end')
                printf '%-24s %-16s %6s %10s\n' "$model" "$mode" "${d}s" "$usd"
                # Every model must quote on the upscaled path. On the native
                # path, only those that render 1080p natively.
                case "$usd" in
                  n/a*)
                    if [ "$mode" = "upscaled-1080p" ] || [ "$native" = "true" ]; then
                      echo "FAIL: $model $mode gave no quote"; fail=1
                    fi ;;
                  *)
                    if [ "$mode" = "native-1080p" ] && [ "$native" != "true" ]; then
                      echo "FAIL: $model quoted native 1080p it cannot render"; fail=1
                    fi ;;
                esac
              done
            done
            # A model priced by soundtrack must cost more with audio on.
            if [ "$audio" = "true" ]; then
              silent=$(curl -sS --max-time 20 "$base/api/quote?model=$model&duration=5&mode=upscaled-1080p&audio=0" | jq -r '.usd // empty')
              loud=$(curl -sS --max-time 20 "$base/api/quote?model=$model&duration=5&mode=upscaled-1080p&audio=1" | jq -r '.usd // empty')
              echo "$model audio pricing: silent=$silent audio=$loud"
              awk -v a="$silent" -v b="$loud" 'BEGIN{exit !(a!="" && b!="" && b>a)}' \
                || { echo "FAIL: $model audio not priced higher"; fail=1; }
            fi
          done

          # A withdrawn or unpriced model must be refused cleanly, not 500,
          # and must not appear in the catalogue.
          for gone in seedance-1.0-lite-t2v seedance-1.0-pro; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 \
              "$base/api/quote?model=$gone&duration=5")
            echo "withdrawn $gone -> HTTP $code (expect 400)"
            [ "$code" = "400" ] || fail=1
            printf '%s' "$models" | grep -qx "$gone" && { echo "FAIL: $gone is still offered"; fail=1; }
          done

          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$base/pricing")
          echo "pricing page   -> HTTP $code (expect 200)"
          [ "$code" = "200" ] || fail=1
          exit $fail
