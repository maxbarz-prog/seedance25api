name: Mail domain

# Stands up mail for a domain whose DNS lives at Cloudflare: the SES sending
# identity, its three DKIM CNAMEs, the MX record that points inbound mail at
# SES, and SPF/DMARC at the apex.
#
# This is a workflow rather than part of sst.config.ts on purpose. Verification
# is a wait: SES only marks the identity verified once the DKIM CNAMEs resolve,
# and nothing should accept mail for the domain before that. A deploy that
# polls for minutes is a job wearing a deployment's clothes. So: run this,
# watch it go green, and only then change the receipt rule and MAIL_DOMAIN.
#
# infra/bootstrap.sh does the same job for remerged.click, whose zone is in
# Route 53. That path is left alone — remerged.click keeps receiving mail.
#
# check and setup are FREE — SES identities, DKIM and DNS records cost nothing.
# test sends one real message and receives it: about $0.0002 all in.

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/mail-domain.yml"
  workflow_dispatch:
    inputs:
      domain:
        description: "The domain that should send and receive mail"
        type: string
        default: "remerged.ai"
      mode:
        description: "check = report only. setup = create the identity and write the records. test = send one message to support@ and follow it through."
        type: choice
        options: ["check", "setup", "test"]
        default: "check"
      replace_mx:
        description: "setup only: delete MX records pointing somewhere other than SES. Leave off unless check says they are in the way."
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

jobs:
  mail:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DOMAIN: ${{ inputs.domain }}
      MODE: ${{ inputs.mode }}
      REGION: us-east-1
    steps:
      - name: Assume deploy role via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::949228118688:role/remerge-github-deploy
          aws-region: us-east-1

      - name: The SES identity
        run: |
          set -euo pipefail
          if aws sesv2 get-email-identity --email-identity "$DOMAIN" >/dev/null 2>&1; then
            echo "identity exists: $DOMAIN"
          elif [ "$MODE" = "setup" ]; then
            aws sesv2 create-email-identity --email-identity "$DOMAIN" >/dev/null
            echo "created identity: $DOMAIN  (Easy DKIM, RSA_2048)"
          else
            echo "no SES identity for $DOMAIN yet — setup would create one."
            echo "NO_IDENTITY=1" >> "$GITHUB_ENV"
            exit 0
          fi
          id=$(aws sesv2 get-email-identity --email-identity "$DOMAIN")
          printf '%s' "$id" | jq -r '
            "  dkim status:   \(.DkimAttributes.Status)",
            "  signing:       \(.DkimAttributes.SigningEnabled)",
            "  for sending:   \(.VerifiedForSendingStatus)"'
          printf '%s' "$id" | jq -r '.DkimAttributes.Tokens[]?' > /tmp/tokens.txt
          echo "  dkim tokens:   $(wc -l < /tmp/tokens.txt)"

      # The inbound half lives in SES and S3 rather than DNS, and SES
      # re-validates the S3 write on every rule update — a rule that worked
      # for months fails to update the moment the bucket stops accepting
      # SES's test object. So show both.
      - name: The receipt rule and its bucket
        run: |
          set -uo pipefail
          echo "  active rule set:"
          aws ses describe-active-receipt-rule-set \
            --query 'Rules[].{name:Name,recipients:Recipients,enabled:Enabled,s3:Actions[?S3Action].S3Action.BucketName,lambda:Actions[?LambdaAction].LambdaAction.FunctionArn}' \
            --output json | sed 's/^/    /' || true
          # Read the bucket off the rule, not by guessing at its name. The name
          # is generated and has already changed once; the rule is the only
          # thing that actually decides where received mail goes.
          b=$(aws ses describe-active-receipt-rule-set \
            --query 'Rules[].Actions[?S3Action].S3Action.BucketName' --output text \
            | tr '\t' '\n' | head -1)
          if [ -z "$b" ]; then
            echo "  the active rule set has no S3 action — nothing stores received mail"
            exit 0
          fi
          echo "  bucket: $b"
          echo "  policy:"
          # Never 2>/dev/null here. An AccessDenied on s3:GetBucketPolicy looks
          # exactly like an absent policy once stderr is thrown away, and the
          # difference is the whole diagnosis.
          if pol=$(aws s3api get-bucket-policy --bucket "$b" --query Policy --output text 2>&1); then
            printf '%s' "$pol" | jq . | sed 's/^/    /'
          else
            echo "    could not read it:"
            printf '%s\n' "$pol" | sed 's/^/    /'
          fi
          echo "  encryption:"
          aws s3api get-bucket-encryption --bucket "$b" 2>/dev/null | jq -c '.ServerSideEncryptionConfiguration.Rules' | sed 's/^/    /' || echo "    (none)"
          echo "  public access block:"
          aws s3api get-public-access-block --bucket "$b" 2>/dev/null | jq -c '.PublicAccessBlockConfiguration' | sed 's/^/    /' || echo "    (none)"
          echo "INBOUND_BUCKET=$b" >> "$GITHUB_ENV"

          # Sandbox is the quiet killer: receiving works, and the forward out
          # to a personal inbox is refused because that address is not a
          # verified identity. Worth seeing before blaming the rule.
          echo "  ses account:"
          aws sesv2 get-account \
            --query '{production:ProductionAccessEnabled,sending:SendingEnabled,quota:SendQuota.Max24HourSend}' \
            --output json | sed 's/^/    /' || true
          echo "  verified identities:"
          aws sesv2 list-email-identities --query 'EmailIdentities[].{id:IdentityName,verified:VerifiedForSendingStatus}' \
            --output json | sed 's/^/    /' || true

          # Off the rule again, for the same reason as the bucket: the rule is
          # what SES actually invokes. Matching function names by pattern found
          # a MailForwarder that nothing was calling, which reads exactly like
          # a broken forwarder.
          fn=$(aws ses describe-active-receipt-rule-set \
            --query 'Rules[].Actions[?LambdaAction].LambdaAction.FunctionArn' --output text \
            | tr '\t' '\n' | head -1)
          fn="${fn##*:function:}"
          if [ -n "$fn" ]; then
            echo "  forwarder: $fn"
            aws lambda get-function-configuration --function-name "$fn" \
              --query 'Environment.Variables.{from:MAIL_FROM,to:FORWARD_TO,bucket:INBOUND_BUCKET,prefix:INBOUND_PREFIX}' \
              --output json | sed 's/^/    /' || true
            echo "MAIL_FORWARDER=$fn" >> "$GITHUB_ENV"
            echo "FORWARD_TO=$(aws lambda get-function-configuration --function-name "$fn" \
              --query 'Environment.Variables.FORWARD_TO' --output text)" >> "$GITHUB_ENV"
          else
            echo "  no forwarder function found"
          fi

      - name: What Cloudflare holds now
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          api="https://api.cloudflare.com/client/v4"
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          zone=$(curl -sS -H "$auth" "$api/zones?name=$DOMAIN" | jq -r '.result[0].id // empty')
          if [ -z "$zone" ]; then
            echo "No Cloudflare zone for $DOMAIN with this token."
            exit 1
          fi
          echo "::add-mask::$zone"
          echo "CF_ZONE=$zone" >> "$GITHUB_ENV"

          echo "  MX at the apex:"
          curl -sS -H "$auth" "$api/zones/$zone/dns_records?type=MX&name=$DOMAIN" \
            | jq -r '.result[] | "    \(.priority) \(.content)"' || true
          echo "  TXT at the apex:"
          curl -sS -H "$auth" "$api/zones/$zone/dns_records?type=TXT&name=$DOMAIN" \
            | jq -r '.result[] | "    \(.content)"' || true
          echo "  _dmarc:"
          curl -sS -H "$auth" "$api/zones/$zone/dns_records?type=TXT&name=_dmarc.$DOMAIN" \
            | jq -r '.result[] | "    \(.content)"' || true
          echo "  DKIM CNAMEs SES wants:"
          if [ -s /tmp/tokens.txt ]; then
            while read -r t; do
              [ -n "$t" ] || continue
              got=$(curl -sS -H "$auth" "$api/zones/$zone/dns_records?type=CNAME&name=$t._domainkey.$DOMAIN" \
                | jq -r '.result[0].content // empty')
              echo "    $t._domainkey -> ${got:-(missing)}"
            done < /tmp/tokens.txt
          else
            echo "    (none known yet)"
          fi

      - name: Write the records
        if: inputs.mode == 'setup'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          REPLACE_MX: ${{ inputs.replace_mx }}
        run: |
          set -euo pipefail
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          api="https://api.cloudflare.com/client/v4"
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          zone="$CF_ZONE"
          inbound="inbound-smtp.$REGION.amazonaws.com"

          # One helper for every record: PUT over the existing one if there is
          # one, POST if there is not, and fail loudly either way.
          upsert() { # type name body
            local type="$1" name="$2" body="$3" existing r
            existing=$(curl -sS -H "$auth" "$api/zones/$zone/dns_records?type=$type&name=$name" \
              | jq -r '.result[0].id // empty')
            if [ -n "$existing" ]; then
              r=$(curl -sS -X PUT -H "$auth" -H "Content-Type: application/json" \
                --data "$body" "$api/zones/$zone/dns_records/$existing")
              echo "  updated  $type $name"
            else
              r=$(curl -sS -X POST -H "$auth" -H "Content-Type: application/json" \
                --data "$body" "$api/zones/$zone/dns_records")
              echo "  created  $type $name"
            fi
            if [ "$(printf '%s' "$r" | jq -r '.success')" != "true" ]; then
              printf '%s' "$r" | jq -r '.errors[]?| "    \(.code): \(.message)"'
              exit 1
            fi
          }

          # DKIM. proxied is false and not negotiable: Cloudflare's proxy
          # answers CNAMEs with its own addresses, which would break signing.
          while read -r t; do
            [ -n "$t" ] || continue
            upsert CNAME "$t._domainkey.$DOMAIN" "$(jq -nc \
              --arg n "$t._domainkey.$DOMAIN" --arg c "$t.dkim.amazonses.com" \
              '{type:"CNAME", name:$n, content:$c, ttl:1, proxied:false}')"
          done < /tmp/tokens.txt

          # MX. More than one MX host means mail goes somewhere other than SES
          # for some of its attempts, so refuse to add ours alongside a
          # stranger's unless told to clear them out. Cloudflare Email Routing
          # is the usual culprit: it installs its own MX on the zone.
          others=$(curl -sS -H "$auth" "$api/zones/$zone/dns_records?type=MX&name=$DOMAIN" \
            | jq -r --arg c "$inbound" '.result[] | select(.content != $c) | "\(.id)\t\(.priority) \(.content)"')
          if [ -n "$others" ]; then
            if [ "$REPLACE_MX" = "true" ]; then
              while IFS=$'\t' read -r id label; do
                [ -n "$id" ] || continue
                curl -sS -X DELETE -H "$auth" "$api/zones/$zone/dns_records/$id" >/dev/null
                echo "  deleted  MX $label"
              done <<< "$others"
            else
              echo "  MX records already point elsewhere:"
              printf '%s\n' "$others" | cut -f2 | sed 's/^/    /'
              echo "  Re-run with replace_mx if SES should be the only destination."
              exit 1
            fi
          fi
          upsert MX "$DOMAIN" "$(jq -nc --arg n "$DOMAIN" --arg c "$inbound" \
            '{type:"MX", name:$n, content:$c, priority:10, ttl:300}')"

          # SPF. Exactly one TXT record may start v=spf1; a second one makes
          # SPF fail outright, so only write when there is nothing to break.
          spf=$(curl -sS -H "$auth" "$api/zones/$zone/dns_records?type=TXT&name=$DOMAIN" \
            | jq -r '.result[] | select(.content | test("v=spf1")) | .content')
          if [ -z "$spf" ]; then
            upsert TXT "$DOMAIN" "$(jq -nc --arg n "$DOMAIN" \
              '{type:"TXT", name:$n, content:"v=spf1 include:amazonses.com ~all", ttl:300}')"
          elif printf '%s' "$spf" | grep -q "amazonses.com"; then
            echo "  kept     TXT SPF (already allows SES)"
          else
            echo "  WARNING  an SPF record exists without SES in it: $spf"
            echo "           add 'include:amazonses.com' to it by hand."
          fi

          # DMARC at p=none: reporting only, so it can never bounce mail, and
          # it satisfies the bulk-sender rules Gmail and Yahoo enforce.
          dmarc=$(curl -sS -H "$auth" "$api/zones/$zone/dns_records?type=TXT&name=_dmarc.$DOMAIN" \
            | jq -r '.result[0].content // empty')
          if [ -z "$dmarc" ]; then
            upsert TXT "_dmarc.$DOMAIN" "$(jq -nc --arg n "_dmarc.$DOMAIN" --arg c \
              "v=DMARC1; p=none; rua=mailto:support@$DOMAIN" \
              '{type:"TXT", name:$n, content:$c, ttl:300}')"
          else
            echo "  kept     TXT _dmarc ($dmarc)"
          fi

      - name: Wait for SES to verify it
        if: inputs.mode == 'setup'
        run: |
          set -uo pipefail
          deadline=$(( $(date +%s) + 900 ))
          while :; do
            s=$(aws sesv2 get-email-identity --email-identity "$DOMAIN" \
              --query 'DkimAttributes.Status' --output text)
            case "$s" in
              SUCCESS) echo "DKIM verified."; break ;;
              FAILED)  echo "SES gave up on the DKIM records. Check they resolve, then re-run."; exit 1 ;;
            esac
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "Still $s after 15 minutes. The records are written; SES rechecks on its own."
              echo "Re-run in check mode later rather than treating this as a failure."
              exit 1
            fi
            echo "  dkim: $s — waiting"
            sleep 20
          done
          echo "MX now resolves to:"
          dig +short MX "$DOMAIN" @1.1.1.1 | sed 's/^/  /'

      # In the SES sandbox — which every account starts in — SES will only send
      # to addresses it has verified. The forwarder's destination is a personal
      # inbox, so without this the whole path works and the last hop is refused:
      #
      #   MessageRejected: Email address is not verified
      #
      # Verifying the destination is free and takes one click in the mail
      # Amazon sends to it. Production access is the real fix, and it is a
      # review, so it does not belong in the middle of a test.
      - name: The forward destination has to be verified
        if: inputs.mode != 'check'
        run: |
          set -uo pipefail
          to="${FORWARD_TO:-}"
          if [ -z "$to" ] || [ "$to" = "None" ]; then
            echo "The forwarder has no FORWARD_TO — set SUPPORT_FORWARD_TO or ADMIN_EMAILS."
            exit 1
          fi
          if [ "$(aws sesv2 get-account --query ProductionAccessEnabled --output text)" = "True" ]; then
            echo "  account has production access — any destination is allowed"
            exit 0
          fi
          echo "  account is in the SES sandbox, so $to must be verified"
          st=$(aws sesv2 get-email-identity --email-identity "$to" \
            --query VerifiedForSendingStatus --output text 2>/dev/null || echo missing)
          case "$st" in
            True) echo "  $to is verified — the forward can go out" ;;
            *)
              aws sesv2 create-email-identity --email-identity "$to" >/dev/null 2>&1 || true
              echo "  $to is NOT verified (status: $st)."
              echo "  Amazon has now emailed a verification link to it — subject"
              echo "  \"Amazon Web Services – Email Address Verification Request\"."
              echo "  Click that link, then run this workflow in test mode again."
              exit 1
              ;;
          esac

      # An end-to-end test, because every part of this can look right and the
      # mail still not arrive. Send one message to support@, watch it land in
      # S3, then read the forwarder's own log for what it did with it.
      # In the SES sandbox — which every account starts in — SES will only send
      # to addresses it has verified. The forwarder's destination is a personal
      # inbox, so without this the whole path works and the last hop is refused:
      #
      #   MessageRejected: Email address is not verified
      #
      # Verifying the destination is free and takes one click in the mail
      # Amazon sends to it. Production access is the real fix, and it is a
      # review, so it does not belong in the middle of a test.
      - name: The forward destination has to be verified
        if: inputs.mode != 'check'
        run: |
          set -uo pipefail
          to="${FORWARD_TO:-}"
          if [ -z "$to" ] || [ "$to" = "None" ]; then
            echo "The forwarder has no FORWARD_TO — set SUPPORT_FORWARD_TO or ADMIN_EMAILS."
            exit 1
          fi
          if [ "$(aws sesv2 get-account --query ProductionAccessEnabled --output text)" = "True" ]; then
            echo "  account has production access — any destination is allowed"
            exit 0
          fi
          echo "  account is in the SES sandbox, so $to must be verified"
          st=$(aws sesv2 get-email-identity --email-identity "$to" \
            --query VerifiedForSendingStatus --output text 2>/dev/null || echo missing)
          case "$st" in
            True) echo "  $to is verified — the forward can go out" ;;
            *)
              aws sesv2 create-email-identity --email-identity "$to" >/dev/null 2>&1 || true
              echo "  $to is NOT verified (status: $st)."
              echo "  Amazon has now emailed a verification link to it — subject"
              echo "  \"Amazon Web Services – Email Address Verification Request\"."
              echo "  Click that link, then run this workflow in test mode again."
              exit 1
              ;;
          esac

      # An end-to-end test, because every part of this can look right and the
      # mail still not arrive. Send to support@, watch for S3 to fill, then
      # read the forwarder's own log for what it did with it. When
      # nothing lands, print the evidence that separates the three possible
      # failures rather than leaving it to guesswork: never reached SES, SES
      # matched no rule, or the rule's action failed and the message bounced.
      - name: Send one message through it
        if: inputs.mode == 'test'
        run: |
          set -uo pipefail
          started=$(date +%s)
          b="${INBOUND_BUCKET:-}"
          before=$(aws s3api list-objects-v2 --bucket "$b" --prefix inbound/ \
            --query 'length(Contents || `[]`)' --output text 2>/dev/null || echo 0)
          echo "  objects under inbound/ before: $before"

          for to in "support@$DOMAIN"; do
            cat > /tmp/content.json <<JSON
          {"Simple":{"Subject":{"Data":"Remerged mail path test to $to"},
            "Body":{"Text":{"Data":"If this reached the private inbox, receiving and forwarding both work."}}}}
          JSON
            id=$(aws sesv2 send-email --from-email-address "no-reply@$DOMAIN" \
              --destination "ToAddresses=$to" --content file:///tmp/content.json \
              --query MessageId --output text 2>&1)
            echo "  sent to $to -> $id"
          done

          echo "  waiting up to 5 minutes for new objects in $b"
          deadline=$(( $(date +%s) + 300 ))
          while :; do
            now=$(aws s3api list-objects-v2 --bucket "$b" --prefix inbound/ \
              --query 'length(Contents || `[]`)' --output text 2>/dev/null || echo 0)
            if [ "$now" -gt "$before" ]; then
              echo "    received $(( now - before )) message(s):"
              aws s3api list-objects-v2 --bucket "$b" --prefix inbound/ \
                --query 'sort_by(Contents, &LastModified)[-3:].[Key,LastModified]' --output text | sed 's/^/      /'
              key=$(aws s3api list-objects-v2 --bucket "$b" --prefix inbound/ \
                --query 'sort_by(Contents, &LastModified)[-1].Key' --output text)
              break
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "    nothing arrived. Evidence:"
              echo "    active rule set:"
              aws ses describe-active-receipt-rule-set --output json \
                | jq -c '{name:.Metadata.Name, rules:[.Rules[]|{Name,Recipients,Enabled,actions:[.Actions[]|keys[0]]}]}' \
                | sed 's/^/      /'
              echo "    bucket policy:"
              if pol=$(aws s3api get-bucket-policy --bucket "$b" --query Policy --output text 2>&1); then
                printf '%s' "$pol" | jq -c '[.Statement[]|{Sid,Principal,Action,Condition}]' | sed 's/^/      /'
              else
                printf '%s\n' "$pol" | sed 's/^/      /'
              fi
              # Sending metrics settle the first question. A Bounce or Reject
              # means SES took the message and something downstream refused it;
              # a Send with no Delivery and no Bounce means it is still in
              # flight or was dropped before reaching the inbound endpoint.
              echo "    SES metrics since the send:"
              for m in Send Delivery Bounce Reject; do
                v=$(aws cloudwatch get-metric-statistics --namespace AWS/SES --metric-name "$m" \
                  --start-time "$(date -u -d @$(( started - 60 )) +%Y-%m-%dT%H:%M:%SZ)" \
                  --end-time "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --period 600 --statistics Sum \
                  --query 'Datapoints[0].Sum' --output text 2>/dev/null)
                echo "      $m: ${v:-none}"
              done
              echo "    MX seen from public resolvers:"
              for r in 1.1.1.1 8.8.8.8; do
                echo "      @$r: $(dig +short MX "$DOMAIN" @$r | tr '\n' ' ')"
              done
              exit 1
            fi
            sleep 10
          done

          # Storing the message is only half of it. The forward is a separate
          # SES action, and it can fail while the S3 write succeeds — in which
          # case SES bounces the message after storing it and the private inbox
          # stays empty.
          fn="${MAIL_FORWARDER:-}"
          if [ -n "$fn" ]; then
            echo "  forwarder: $fn"
            # Asynchronous invocation, so the log lags the S3 write.
            sleep 25
            # Ask the function where it logs. SST gives its functions an
            # explicit log group, so /aws/lambda/<name> does not exist and its
            # absence looks exactly like a function that has never run — which
            # cost me two wrong conclusions tonight.
            lg=$(aws lambda get-function-configuration --function-name "$fn" \
              --query 'LoggingConfig.LogGroup' --output text 2>/dev/null)
            [ -n "$lg" ] && [ "$lg" != "None" ] || lg="/aws/lambda/$fn"
            echo "    log group: $lg"
            echo "    log (errors shown, not hidden):"
            # || true on each: the runner's shell has -e, and a missing log
            # group is a finding to print, not a reason to stop printing.
            { aws logs filter-log-events --log-group-name "$lg" \
              --start-time "$(( started * 1000 ))" \
              --query 'events[].message' --output text 2>&1 || true; } | sed 's/^/      /'
            echo "    may SES invoke it:"
            { aws lambda get-policy --function-name "$fn" --query Policy --output text 2>&1 || true; } \
              | (jq -c '[.Statement[]|{Sid,Principal,Action,Condition}]' 2>/dev/null || cat) | sed 's/^/      /'
            # Then invoke it directly with the message that just landed. A
            # synchronous invoke returns the error and the last 4KB of logs in
            # the response, so it answers "does the forward work" without
            # depending on a log group existing, and separates the forwarder's
            # own behaviour from whether SES is calling it at all.
            echo "    invoking it directly with ${key:-?}:"
            payload=$(jq -nc --arg id "${key##inbound/}" --arg from "no-reply@$DOMAIN" \
              '{Records:[{ses:{mail:{messageId:$id, source:$from,
                 commonHeaders:{from:[$from], subject:"direct invoke check"}}}}]}')
            code=$(aws lambda invoke --function-name "$fn" --log-type Tail \
              --cli-binary-format raw-in-base64-out --payload "$payload" \
              --query 'to_string([StatusCode, FunctionError || `ok`])' --output text /tmp/out.json 2>&1 || true)
            echo "      status: $code"
            echo "      response: $(head -c 400 /tmp/out.json 2>/dev/null)"
            aws lambda invoke --function-name "$fn" --log-type Tail \
              --cli-binary-format raw-in-base64-out --payload "$payload" \
              --query LogResult --output text /tmp/out2.json 2>/dev/null \
              | base64 -d 2>/dev/null | sed 's/^/      /' || true

            # Whether SES is calling it at all is a separate question from
            # whether it works, and these are the three things that hide the
            # answer: a throttled function is never invoked and writes no log,
            # a role without logs permissions runs invisibly, and the rule's
            # own action list is the only record of what SES was told to do.
            echo "    reserved concurrency: $(aws lambda get-function-concurrency \
              --function-name "$fn" --query ReservedConcurrentExecutions --output text 2>&1 || true)"
            role=$(aws lambda get-function-configuration --function-name "$fn" \
              --query Role --output text 2>/dev/null || true)
            echo "    role: ${role##*/}"
            { aws iam list-attached-role-policies --role-name "${role##*/}" \
              --query 'AttachedPolicies[].PolicyName' --output text 2>&1 || true; } | sed 's/^/      attached: /'
            { aws iam list-role-policies --role-name "${role##*/}" \
              --query 'PolicyNames' --output text 2>&1 || true; } | sed 's/^/      inline: /'
            for m in Invocations Errors Throttles; do
              v=$(aws cloudwatch get-metric-statistics --namespace AWS/Lambda --metric-name "$m" \
                --dimensions "Name=FunctionName,Value=$fn" \
                --start-time "$(date -u -d @$(( started - 60 )) +%Y-%m-%dT%H:%M:%SZ)" \
                --end-time "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --period 600 --statistics Sum \
                --query 'Datapoints[0].Sum' --output text 2>/dev/null)
              echo "    $m: ${v:-none}"
            done
          fi
          # A bounce here means SES stored the message and then refused it,
          # which is what a failing Lambda action looks like from the outside.
          for m in Bounce Reject; do
            v=$(aws cloudwatch get-metric-statistics --namespace AWS/SES --metric-name "$m" \
              --start-time "$(date -u -d @$(( started - 60 )) +%Y-%m-%dT%H:%M:%SZ)" \
              --end-time "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --period 600 --statistics Sum \
              --query 'Datapoints[0].Sum' --output text 2>/dev/null)
            echo "  SES $m since the send: ${v:-none}"
          done
          echo "  the rule exactly as SES holds it:"
          aws ses describe-active-receipt-rule-set --output json \
            | jq -c '.Rules[]' | sed 's/^/    /' || true
          echo
          echo "If the log shows an error sending, the account is probably still in"
          echo "the SES sandbox and the forward destination is not a verified identity."

      - name: What is left to do by hand
        if: inputs.mode == 'setup'
        run: |
          set -euo pipefail
          echo "Inbound: deploy so the receipt rule accepts support@$DOMAIN."
          echo
          echo "Outbound from Gmail (Settings -> Accounts -> Send mail as):"
          echo "  address   support@$DOMAIN"
          echo "  smtp host $(aws ssm get-parameter --name /remerged/mail/SMTP_HOST --query Parameter.Value --output text)"
          echo "  port      587, TLS"
          echo "  username  $(aws ssm get-parameter --name /remerged/mail/SMTP_USERNAME --query Parameter.Value --output text)"
          echo "  password  read /remerged/mail/SMTP_PASSWORD in the SSM console — it is not printed here."
          echo
          echo "Gmail mails a confirmation code to support@$DOMAIN. The forwarder"
          echo "delivers it, so watch the inbox it forwards to."
