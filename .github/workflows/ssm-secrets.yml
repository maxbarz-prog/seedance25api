name: Set stage secrets

# Fills in the parameters a stage needs to run: CRON_SECRET, SESSION_SECRET
# and EMAIL_FROM. Free, and it deploys nothing — production only ever ships
# from a prod-* tag, so a stage can be configured long before it goes live.
#
# Generated secrets are written ONCE. An existing value is never overwritten
# unless `overwrite` says so, because rotating SESSION_SECRET signs every
# member out and rotating CRON_SECRET breaks the running cron until the next
# deploy. Values are never printed — only a fingerprint, which is enough to
# confirm two stages differ without revealing either.

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ssm-secrets.yml"
  workflow_dispatch:
    inputs:
      stage:
        description: "Stage to configure"
        type: choice
        options: ["prod", "dev"]
        default: prod
      email_from:
        description: "Outbound sender. Must match a verified SES identity."
        type: string
        default: "no-reply@remerged.ai"
      overwrite:
        description: 'Replace secrets that already exist. "yes" signs every member out.'
        type: choice
        options: ["no", "yes"]
        default: "no"

permissions:
  id-token: write
  contents: read

jobs:
  configure:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Assume deploy role via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::949228118688:role/remerge-github-deploy
          aws-region: us-east-1

      - name: Set the secrets
        env:
          STAGE: ${{ inputs.stage }}
          EMAIL_FROM: ${{ inputs.email_from }}
          OVERWRITE: ${{ inputs.overwrite }}
        run: |
          set -euo pipefail

          exists() {
            aws ssm get-parameter --name "$1" >/dev/null 2>&1
          }
          # A short hash, not the value. Enough to tell two stages apart.
          fingerprint() {
            printf '%s' "$1" | sha256sum | cut -c1-12
          }

          for name in CRON_SECRET SESSION_SECRET; do
            path="/remerged/$STAGE/$name"
            if exists "$path" && [ "$OVERWRITE" != "yes" ]; then
              cur=$(aws ssm get-parameter --name "$path" --with-decryption \
                --query Parameter.Value --output text)
              echo "::add-mask::$cur"
              echo "$name already set (fingerprint $(fingerprint "$cur")) — left alone"
              continue
            fi
            value=$(openssl rand -base64 48 | tr -d '\n')
            echo "::add-mask::$value"
            aws ssm put-parameter --name "$path" --value "$value" \
              --type SecureString --overwrite >/dev/null
            echo "$name written (fingerprint $(fingerprint "$value"))"
          done

          # Not a secret, and it has to match the SES identity, so it is set
          # outright rather than generated.
          aws ssm put-parameter --name "/remerged/$STAGE/EMAIL_FROM" \
            --value "$EMAIL_FROM" --type String --overwrite >/dev/null
          echo "EMAIL_FROM set to $EMAIL_FROM"

      - name: What the stage now has
        env:
          STAGE: ${{ inputs.stage }}
        run: |
          set -euo pipefail
          echo "--- /remerged/$STAGE parameter names ---"
          aws ssm get-parameters-by-path --path "/remerged/$STAGE" \
            --query 'Parameters[].Name' --output text | tr '\t' '\n' | sort

          echo
          echo "--- required for the app to run ---"
          missing=0
          for name in CRON_SECRET SESSION_SECRET EMAIL_FROM ADMIN_EMAILS \
                      BYTEPLUS_API_KEY FAL_KEY STRIPE_SECRET_KEY \
                      STRIPE_WEBHOOK_SECRET CLERK_SECRET_KEY \
                      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY; do
            if aws ssm get-parameter --name "/remerged/$STAGE/$name" >/dev/null 2>&1; then
              echo "  ok      $name"
            else
              echo "  MISSING $name"
              missing=$((missing+1))
            fi
          done
          echo
          if [ "$missing" -gt 0 ]; then
            echo "$missing parameter(s) still missing — the stage is not ready to deploy."
            exit 1
          fi
          echo "All required parameters present. Nothing deployed: production ships only from a prod-* tag."
