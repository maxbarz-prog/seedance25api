name: Clerk password policy

# The shortest password Clerk will accept for the accounts it manages.
#
# Our own forms carry the same number (web/lib/config.ts, MIN_PASSWORD_CHARS)
# and check it before anything is sent, so the two have to agree: a form that
# accepts twelve characters in front of an instance that demands fifteen tells
# somebody their password is fine and then tells them it is not.
#
# `show` prints what the browser is actually told, which is the authority —
# the same /v1/environment document clerk-js reads on every page load. `apply`
# tries the Backend API, and then re-reads that document to see whether the
# change took. It reports what happened rather than assuming: not every
# instance setting is exposed on the Backend API, and one that is not accepts
# a PATCH and ignores it.
#
# FREE. One SSM read and a few Clerk API calls.

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "Which stage's Clerk instance"
        type: choice
        options: ["dev", "prod"]
        default: dev
      length:
        description: "Minimum password length"
        type: string
        default: "12"
      mode:
        description: "show = print the current policy. apply = try to set it."
        type: choice
        options: ["show", "apply"]
        default: show

permissions:
  id-token: write
  contents: read

jobs:
  password:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Assume deploy role via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::949228118688:role/remerge-github-deploy
          aws-region: us-east-1

      - name: Load the Clerk keys
        env:
          STAGE: ${{ inputs.stage }}
          WANT: ${{ inputs.length }}
        run: |
          set -euo pipefail
          case "$WANT" in
            ''|*[!0-9]*) echo "Length must be a whole number."; exit 1 ;;
          esac
          if [ "$WANT" -lt 8 ] || [ "$WANT" -gt 72 ]; then
            echo "Clerk accepts a minimum between 8 and 72."; exit 1
          fi
          echo "WANT=$WANT" >> "$GITHUB_ENV"
          v=$(aws ssm get-parameter --name "/remerged/$STAGE/CLERK_SECRET_KEY" --with-decryption \
            --query Parameter.Value --output text)
          echo "::add-mask::$v"
          echo "CLERK_SECRET_KEY=$v" >> "$GITHUB_ENV"
          p=$(aws ssm get-parameter --name "/remerged/$STAGE/NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY" \
            --query Parameter.Value --output text)
          host=$(python3 -c "import base64,sys; s=sys.argv[1].split('_',2)[2]; s+='='*(-len(s)%4); print(base64.b64decode(s).decode().rstrip('\$'))" "$p")
          echo "FAPI=$host" >> "$GITHUB_ENV"

      - name: What the browser is told now
        run: |
          set -euo pipefail
          curl -sS -H "Cache-Control: no-cache" \
            "https://$FAPI/v1/environment?__clerk_api_version=2025-04-10&_clerk_js_version=5.100.0&_cb=$(date +%s)" \
            > /tmp/env.json
          echo "  password settings:"
          jq -r '.user_settings.password_settings // {} | to_entries[] | "    \(.key) = \(.value)"' /tmp/env.json
          have=$(jq -r '.user_settings.password_settings.min_length // "-"' /tmp/env.json)
          echo "  minimum now: $have   wanted: $WANT"

      - name: Try to set it
        if: inputs.mode == 'apply'
        run: |
          set -euo pipefail
          # Two shapes, because the Backend API's coverage of instance settings
          # is uneven and the failure mode of the wrong one is a silent 200.
          # Whichever lands, the environment document below is what decides.
          for body in \
            "{\"password_settings\":{\"min_length\":$WANT}}" \
            "{\"min_length\":$WANT}"; do
            for path in "instance" "instance/user_settings" "instance/password_settings"; do
              code=$(curl -sS -o /tmp/out.json -w '%{http_code}' -X PATCH \
                -H "Authorization: Bearer $CLERK_SECRET_KEY" \
                -H "Content-Type: application/json" \
                -d "$body" "https://api.clerk.com/v1/$path" || echo "000")
              # A 204 has no body at all, and jq exits non-zero on empty
              # input — which under `set -e` killed the sweep at its first
              # success, before anything could check whether it had worked.
              msg=$(jq -r '(.errors[]?.message // empty)' /tmp/out.json 2>/dev/null | head -1 || true)
              echo "  PATCH /v1/$path  $body  -> $code ${msg:+($msg)}"
            done
          done

      - name: What the browser is told after
        if: inputs.mode == 'apply'
        run: |
          set -euo pipefail
          # Clerk serves this document from a cache; give the write a moment.
          sleep 10
          curl -sS -H "Cache-Control: no-cache" \
            "https://$FAPI/v1/environment?__clerk_api_version=2025-04-10&_clerk_js_version=5.100.0&_cb=$(date +%s)" \
            > /tmp/after.json
          now=$(jq -r '.user_settings.password_settings.min_length // "-"' /tmp/after.json)
          echo "  minimum now: $now"
          if [ "$now" = "$WANT" ]; then
            echo "Done — Clerk now asks for $WANT characters."
          else
            echo "NOT APPLIED. The Backend API does not expose this setting on this instance."
            echo "  -> Clerk dashboard: Configure -> Authentication -> Password, set the minimum to $WANT."
            echo "     web/lib/config.ts MIN_PASSWORD_CHARS must match whatever is set there."
            exit 1
          fi
