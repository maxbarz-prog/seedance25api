name: AWS access check

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/aws-verify.yml"

permissions:
  id-token: write
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Assume deploy role via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::949228118688:role/remerge-github-deploy
          aws-region: us-east-1

      - name: Who am I
        run: aws sts get-caller-identity

      # Parameter NAMES only — never values. Enough to see which cost
      # overrides exist in SSM, since an override silently wins over the rate
      # derived in code and would keep an old (wrong) price in force.
      - name: List /remerged parameter names
        run: |
          set -euo pipefail
          for stage in dev prod; do
            echo "--- /remerged/$stage ---"
            aws ssm get-parameters-by-path --path "/remerged/$stage" \
              --query 'Parameters[].Name' --output text | tr '\t' '\n' | sort || true
          done

      # COST_* values only. These are per-second provider rates — the same
      # numbers the public pricing page is computed from, not credentials —
      # and an override here silently beats the rate derived in code, so we
      # have to be able to see it.
      - name: Show COST_* parameter values
        run: |
          set -euo pipefail
          for stage in dev prod; do
            echo "--- /remerged/$stage ---"
            aws ssm get-parameters-by-path --path "/remerged/$stage" \
              --query 'Parameters[?contains(Name, `COST_`)].[Name,Value]' \
              --output text | sort || true
          done
