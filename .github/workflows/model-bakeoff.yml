name: Model bake-off

# Renders the same 5s shot from every model we sell, upscales each to 1080p,
# and keeps both versions as artifacts so they can be compared side by side.
# Also reports, per model, the tokens the provider actually billed against
# what we would have charged — a live test of the rate table and the margin
# guard.
#
# THIS SPENDS REAL MONEY. It is manual-only, requires typing the word "spend"
# to confirm, and prints the estimate before it starts.

on:
  push:
    branches:
      - claude/seedance-1080p-verify-c8cbha
    paths:
      - ".github/workflows/model-bakeoff.yml"
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "spend" to confirm this will cost real money (~$1.75)'
        type: string
        default: ""
      duration:
        description: "Seconds per clip"
        type: string
        default: "5"
      key_image_url:
        description: "Reuse a key frame from an earlier run (blank = render a new one, ~$0.12)"
        type: string
        default: ""
      reuse_run_id:
        description: "Run id of an earlier bake-off whose seed clip to reuse (avoids re-rendering the key frame)"
        type: string
        default: ""
      prompt:
        description: "Motion prompt (blank = the default bicycle shot)"
        type: string
        default: ""
      models:
        description: "Only these model ids, comma separated (blank = all). Use with reuse_run_id to redo one without re-paying for the rest."
        type: string
        default: ""
      native:
        description: 'Render natively at 1080p with no upscaler ("yes"), instead of 480p + upscale. Only 2.5 and 2.0 can.'
        type: choice
        options: ["no", "yes"]
        default: "no"
      t2v:
        description: 'Text-to-video with no starting image ("yes"). Needed for anything involving people — the provider refuses photographs of real people.'
        type: choice
        options: ["no", "yes"]
        default: "no"

permissions:
  id-token: write
  contents: read

jobs:
  bakeoff:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check the confirmation
        run: |
          if [ "${{ inputs.confirm }}" != "spend" ]; then
            echo "Not confirmed — type \"spend\" in the confirm box to run this."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The runner image no longer ships ffmpeg. ffmpeg-static is the same
      # build the production Lambda bundles, so this matches what we run.
      - name: Install ffmpeg
        run: |
          set -euo pipefail
          npm install --no-save ffmpeg-static ffprobe-static
          echo "FFMPEG_PATH=$(node -p "require('ffmpeg-static')")" >> "$GITHUB_ENV"
          echo "FFPROBE_PATH=$(node -p "require('ffprobe-static').path")" >> "$GITHUB_ENV"

      - name: Reuse an earlier seed clip
        if: inputs.reuse_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: model-bakeoff
          path: bakeoff
          run-id: ${{ inputs.reuse_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Assume deploy role via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::949228118688:role/remerge-github-deploy
          aws-region: us-east-1

      - name: Load provider keys from SSM
        run: |
          set -euo pipefail
          for name in BYTEPLUS_API_KEY FAL_KEY; do
            v=$(aws ssm get-parameter --name "/remerged/dev/$name" --with-decryption \
              --query Parameter.Value --output text)
            echo "::add-mask::$v"
            echo "$name=$v" >> "$GITHUB_ENV"
          done

      # Load the script with SPEND_OK unset: it exits 2 before any API call.
      # `node --check` only parses, so it misses things like using a const
      # before its declaration — which is exactly what reached a paid run
      # once. This costs nothing and catches it.
      - name: Preflight the script (spends nothing)
        env:
          BAKEOFF_NATIVE: ${{ inputs.native == 'yes' && '1' || '0' }}
          BAKEOFF_T2V: ${{ inputs.t2v == 'yes' && '1' || '0' }}
          BAKEOFF_DURATION_S: ${{ inputs.duration }}
          BAKEOFF_PROMPT: ${{ inputs.prompt }}
          BAKEOFF_MODELS: ${{ inputs.models }}
        run: |
          set -uo pipefail
          # Steps run under `bash -e`, so the script's deliberate exit 2 would
          # abort this step before the check below. `|| code=$?` keeps it
          # alive to read the code.
          code=0
          node scripts/model-bakeoff.mjs || code=$?
          if [ "$code" != "2" ]; then
            echo "Preflight expected exit 2 (loaded, refused to spend) but got $code"
            exit 1
          fi
          echo "Preflight clean: the script loads and refuses to spend."

      - name: Run the bake-off
        env:
          SPEND_OK: "yes"
          BAKEOFF_OUT: ${{ github.workspace }}/bakeoff
          BAKEOFF_DURATION_S: ${{ inputs.duration }}
          KEY_IMAGE_URL: ${{ inputs.key_image_url }}
          BAKEOFF_PROMPT: ${{ inputs.prompt }}
          BAKEOFF_MODELS: ${{ inputs.models }}
          BAKEOFF_NATIVE: ${{ inputs.native == 'yes' && '1' || '0' }}
          BAKEOFF_T2V: ${{ inputs.t2v == 'yes' && '1' || '0' }}
          SEED_CLIP_PATH: ${{ github.workspace }}/bakeoff/seed-clip.mp4
        run: |
          set -euo pipefail
          mkdir -p bakeoff
          ls -la bakeoff/ || true
          node scripts/model-bakeoff.mjs

      - name: Upload the clips
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-bakeoff
          path: bakeoff/
          retention-days: 30
          overwrite: true
