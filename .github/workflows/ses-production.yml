name: SES production access

# Asks AWS to take the account out of the SES sandbox, where SES will only
# send to addresses it has already verified. Until then the one member-facing
# SES message — "your video is ready" — reaches nobody real. Sign-in,
# verification and password resets are Clerk's and are unaffected.
#
# It is an API call, not a console form: sesv2 PutAccountDetails carries the
# same fields the console collects. Doing it here means the use case AWS
# reviews is in the repository, reviewable, and identical every time rather
# than retyped from memory into a text box.
#
# FREE. AWS reviews the request, usually within a day. Check the outcome with
# `show`, which reads ProductionAccessEnabled.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "show = report the account's sending status. submit = request production access."
        type: choice
        options: ["show", "submit"]
        default: "show"
      website:
        description: "The site AWS will look at"
        type: string
        default: "https://remerged.ai"
      confirm:
        description: 'For submit only: type "submit". It opens a case with AWS in the account owner''s name.'
        type: string
        default: ""

permissions:
  id-token: write
  contents: read

jobs:
  request:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check the confirmation
        if: inputs.mode == 'submit'
        run: |
          if [ "${{ inputs.confirm }}" != "submit" ]; then
            echo 'Not confirmed — type "submit" to open the request.'
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Assume deploy role via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::949228118688:role/remerge-github-deploy
          aws-region: us-east-1

      - name: Where the account stands
        run: |
          set -uo pipefail
          aws sesv2 get-account --query '{
            production:ProductionAccessEnabled,
            sending:SendingEnabled,
            enforcement:EnforcementStatus,
            quota:SendQuota,
            suppression:SuppressionAttributes,
            details:Details}' --output json | sed 's/^/  /' || true
          echo "  verified identities:"
          aws sesv2 list-email-identities \
            --query 'EmailIdentities[].{id:IdentityName,type:IdentityType,verified:VerifiedForSendingStatus}' \
            --output json | sed 's/^/    /' || true

          # A denied request leaves only a case id behind, and the reason lives
          # in the case. Reading it needs a Business or Enterprise support plan;
          # on Basic this fails, which is itself the answer — the reason can
          # only be read in the console.
          case_id=$(aws sesv2 get-account --query 'Details.ReviewDetails.CaseId' --output text 2>/dev/null)
          if [ -n "$case_id" ] && [ "$case_id" != "None" ]; then
            echo "  review case $case_id:"
            { aws support describe-cases --case-id-list "$case_id" --include-resolved-cases \
              --region us-east-1 --query 'cases[].{status:status,subject:subject,
                latest:recentCommunications.communications[0].body}' --output json 2>&1 || true; } \
              | head -c 3000 | sed 's/^/    /'
          fi

      - name: Ask for production access
        if: inputs.mode == 'submit'
        env:
          WEBSITE: ${{ inputs.website }}
        run: |
          set -uo pipefail
          if [ "$(aws sesv2 get-account --query ProductionAccessEnabled --output text)" = "True" ]; then
            echo "Already out of the sandbox — nothing to request."
            exit 0
          fi

          # PutAccountDetails only works while the account has no details set.
          # Once a request has been reviewed — denied, in this account's case —
          # the API returns ConflictException and the only route is the console
          # or the case itself. Say that instead of failing on a raw API error.
          review=$(aws sesv2 get-account --query 'Details.ReviewDetails.Status' --output text 2>/dev/null)
          case_id=$(aws sesv2 get-account --query 'Details.ReviewDetails.CaseId' --output text 2>/dev/null)
          if [ -n "$review" ] && [ "$review" != "None" ]; then
            echo "A request already exists on this account: $review (case $case_id)."
            echo
            echo "The API cannot replace it — PutAccountDetails returns"
            echo "ConflictException once details are set. Do it in the console:"
            echo "  https://console.aws.amazon.com/ses/home?region=us-east-1#/account"
            echo "  -> Request production access, or reply on case $case_id."
            echo
            echo "Paste infra/ses-use-case.txt as the use case, and set the"
            echo "website to https://remerged.ai — the denied request still has"
            echo "$(aws sesv2 get-account --query 'Details.WebsiteURL' --output text) on file."
            exit 1
          fi

          # The text lives in infra/ses-use-case.txt so the same words go to AWS
          # whether the request is made from here or pasted into the console,
          # and so it can be reviewed against the code. A reviewer rejects a
          # vague use case, and an inaccurate one is worse than a rejection.
          #
          # On THIS account that file is addressed as a reply to case
          # 178878528300157, because a reviewed request closes the API route
          # and the case is the only way back in. Reword the opening if this
          # ever runs against an account with no history.
          cp infra/ses-use-case.txt /tmp/usecase.txt
          echo "Submitting this use case:"
          sed 's/^/  /' /tmp/usecase.txt

          if out=$(aws sesv2 put-account-details \
            --production-access-enabled \
            --mail-type TRANSACTIONAL \
            --website-url "$WEBSITE" \
            --contact-language EN \
            --use-case-description "$(cat /tmp/usecase.txt)" 2>&1); then
            echo
            echo "Submitted. AWS reviews it, usually within a day."
            echo "Check with: this workflow in show mode, or"
            echo "aws sesv2 get-account --query ProductionAccessEnabled"
          else
            echo
            echo "AWS did not accept the request:"
            printf '%s\n' "$out" | sed 's/^/  /'
            echo
            echo "A ConflictException means account details are already set —"
            echo "the request exists, or was made before; show mode says which."
            exit 1
          fi
