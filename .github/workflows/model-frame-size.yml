name: Frame size probe

# What frame size does each model actually emit at a given resolution? The
# whole price is derived from it, and it is not predictable from the
# resolution name: "480p" is 854x480 on Seedance 2.5 and 864x496 on the 2.0
# family. Until a resolution has been measured this way it stays out of
# VERIFIED_QUALITIES in web/lib/config.ts and is not offered — guessing it low
# sells below cost, guessing it high overcharges, and estimates are held to
# 0..+1% of the invoice.
#
# THIS SPENDS REAL MONEY. Manual-only, requires typing "spend", and prints the
# estimate before it starts. One short clip per model: about $2.35 at 720p for
# all four (less in practice, two of them are on promotion).

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/model-frame-size.yml"
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "spend" to confirm this will cost real money (~$2.35 at 720p, all models)'
        type: string
        default: ""
      resolution:
        description: "Resolution to measure"
        type: choice
        options: ["720p", "480p", "1080p"]
        default: "720p"
      duration:
        description: "Seconds per clip — the frame size does not depend on it, so keep it at the minimum"
        type: string
        default: "4"
      models:
        description: "Only these model ids, comma separated (blank = all)"
        type: string
        default: ""
      reuse_run_id:
        description: "Run id of an earlier probe whose measurements to resume from — models it already answered for are skipped rather than re-rendered"
        type: string
        default: ""

permissions:
  id-token: write
  contents: read

jobs:
  probe:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Each model is polled for up to 25 minutes, serially, so four of them can
    # in principle run past an hour. The script now saves after every model
    # and the artifact uploads even on failure, so a run that does hit this
    # can be resumed with reuse_run_id instead of paying again — but the cap
    # is set high enough that it should not come to that.
    timeout-minutes: 115
    steps:
      - name: Check the confirmation
        run: |
          if [ "${{ inputs.confirm }}" != "spend" ]; then
            echo "Not confirmed — type \"spend\" in the confirm box to run this."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The runner image no longer ships ffprobe, and the probe reads the
      # delivered frame with it to cross-check the billed pixel count.
      - name: Install ffprobe
        run: npm install --no-save ffprobe-static

      - name: Resume from an earlier probe
        if: inputs.reuse_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: frame-size-probe
          path: framesize
          run-id: ${{ inputs.reuse_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Assume deploy role via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::949228118688:role/remerge-github-deploy
          aws-region: us-east-1

      - name: Load the provider key from SSM
        run: |
          set -euo pipefail
          v=$(aws ssm get-parameter --name "/remerged/dev/BYTEPLUS_API_KEY" --with-decryption \
            --query Parameter.Value --output text)
          echo "::add-mask::$v"
          echo "BYTEPLUS_API_KEY=$v" >> "$GITHUB_ENV"

      # Load the script with SPEND_OK unset: it exits 2 before any API call.
      # `node --check` only parses, so it misses a const used before its
      # declaration — which is exactly what once reached a paid run.
      - name: Preflight the script (spends nothing)
        env:
          PROBE_RESOLUTION: ${{ inputs.resolution }}
          PROBE_DURATION_S: ${{ inputs.duration }}
          PROBE_MODELS: ${{ inputs.models }}
        run: |
          set -uo pipefail
          code=0
          node scripts/frame-size-probe.mjs || code=$?
          if [ "$code" != "2" ]; then
            echo "Preflight expected exit 2 (loaded, refused to spend) but got $code"
            exit 1
          fi
          echo "Preflight clean: the script loads and refuses to spend."

      - name: Measure
        env:
          SPEND_OK: "yes"
          PROBE_RESOLUTION: ${{ inputs.resolution }}
          PROBE_DURATION_S: ${{ inputs.duration }}
          PROBE_MODELS: ${{ inputs.models }}
          PROBE_OUT: ${{ github.workspace }}/framesize
        run: |
          set -euo pipefail
          mkdir -p framesize
          ls -la framesize/ || true
          node scripts/frame-size-probe.mjs

      - name: Upload the clips and the measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frame-size-probe
          path: framesize/
          retention-days: 30
          overwrite: true
