name: Landing showcase

# Renders the landing page's showcase clips (web/lib/landing.ts) on Seedance
# 2.5, upscales them to 4K, encodes the 1080p web versions, and commits
# those to the branch it was run on. The 4K masters are kept as an artifact.
#
# THIS SPENDS REAL MONEY: about $1.78 for the 1080p hero and $1.05 per
# 720p card, all upscaled to 4K — $4.94 for the four. The script refuses to
# pass the cap in `max_usd`, and only renders clips that are missing, so a
# re-run after one failure pays for one clip. Manual-only, and needs the
# word "spend" typed to confirm.

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/landing-showcase.yml"
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "spend" to confirm this will cost real money (about $4.94 for all four clips)'
        type: string
        default: ""
      max_usd:
        description: "Hard cap on provider spend for this run, in USD"
        type: string
        default: "5"
      only:
        description: "Only these clips, comma separated (blank = every clip that is missing)"
        type: string
        default: ""
      force:
        description: 'Re-render clips that already exist ("yes")'
        type: choice
        options: ["no", "yes"]
        default: "no"
      commit:
        description: 'Commit the web encodes to this branch ("yes"), or only keep them as an artifact'
        type: choice
        options: ["yes", "no"]
        default: "yes"

permissions:
  id-token: write
  contents: write

jobs:
  showcase:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check the confirmation
        run: |
          if [ "${{ inputs.confirm }}" != "spend" ]; then
            echo "Not confirmed — type \"spend\" in the confirm box to run this."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The runner image no longer ships ffmpeg. ffmpeg-static is the same
      # build the production Lambda bundles.
      - name: Install ffmpeg
        run: |
          set -euo pipefail
          npm install --no-save ffmpeg-static ffprobe-static
          echo "FFMPEG_PATH=$(node -p "require('ffmpeg-static')")" >> "$GITHUB_ENV"
          echo "FFPROBE_PATH=$(node -p "require('ffprobe-static').path")" >> "$GITHUB_ENV"

      - name: Assume deploy role via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::949228118688:role/remerge-github-deploy
          aws-region: us-east-1

      - name: Load provider keys from SSM
        run: |
          set -euo pipefail
          for name in BYTEPLUS_API_KEY FAL_KEY; do
            v=$(aws ssm get-parameter --name "/remerged/dev/$name" --with-decryption \
              --query Parameter.Value --output text)
            echo "::add-mask::$v"
            echo "$name=$v" >> "$GITHUB_ENV"
          done

      # Loads the script with SPEND_OK unset: it must exit 2 before any API
      # call. Catches a script that does not even parse before money moves.
      - name: Preflight the script (spends nothing)
        run: |
          set -uo pipefail
          code=0
          node --experimental-strip-types --no-warnings scripts/landing-showcase.mjs || code=$?
          if [ "$code" != "2" ]; then
            echo "Preflight expected exit 2 (loaded, refused to spend) but got $code"
            exit 1
          fi
          echo "Preflight clean: the script loads and refuses to spend."

      - name: Render, upscale and encode
        env:
          SPEND_OK: "yes"
          MAX_SPEND_USD: ${{ inputs.max_usd }}
          ONLY: ${{ inputs.only }}
          FORCE: ${{ inputs.force == 'yes' && '1' || '0' }}
          SHOWCASE_OUT: ${{ github.workspace }}/showcase-out
        run: node --experimental-strip-types --no-warnings scripts/landing-showcase.mjs

      - name: Keep the 4K masters
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: landing-showcase-4k
          path: showcase-out/
          retention-days: 90
          overwrite: true

      - name: Commit the web encodes
        if: inputs.commit == 'yes'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/landing
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
            exit 0
          fi
          spent=$(node -p "require('./showcase-out/showcase.json').totals.spentUsd")
          git commit -m "Landing showcase clips, rendered and encoded" \
            -m "Rendered by the landing-showcase workflow from web/lib/landing.ts: 1080p web encodes of 4K masters, plus posters. Provider spend this run: \$$spent."
          git push origin "HEAD:${{ github.ref_name }}"
